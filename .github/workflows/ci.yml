name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck, build & storybook (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:cycles
      - run: npm run check:stories
      - run: npm run check:animatable
      - run: npm run build
      - run: npm run stories:build
      # The flagship demos must typecheck and build against the (source-aliased) packages.
      - run: npm run typecheck -w trailhead
      - run: npm run build -w trailhead
      - run: npm run typecheck -w surface-composer
      - run: npm run build -w surface-composer
      - run: npm run typecheck -w showcase
      - run: npm run build -w showcase

  unit:
    name: unit (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Topological build: the kit's declaration build resolves the @tg-mini-app/telegram
      # peer from its built dist, and the tokens-contract tests assert against dist/style.css.
      - run: npm run build
      - run: npm run test:unit
      # Surface Composer demo-only unit logic (reducer, recorder, runtime-mode).
      - run: npm run test -w surface-composer

  package:
    name: packaging gates (publint, attw, size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Topological build so the kit's declaration build resolves the platform peer.
      - run: npm run build
      - run: npm run check:package
      # Prove the published export surface matches the committed baseline.
      - run: npm run check:api

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # Runs package-local Storybook smoke coverage for implemented element stories.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Floor gate: fail if the collected test count silently drops (e.g. a
      # config change that makes specs match no project — the regression that
      # once left CI green while validating a third of the suite).
      - run: npm run check:e2e-count
        env:
          HOME: /root
      - run: npm run test:e2e
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
