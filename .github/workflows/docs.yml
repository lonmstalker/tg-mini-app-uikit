name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Build-and-smoke only: the live site (landing + /docs + /storybook + /demo)
# deploys from Cloudflare Workers Builds (see wrangler.jsonc), not GitHub Pages.
jobs:
  docs:
    name: docs build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run build
