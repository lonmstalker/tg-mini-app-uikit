name: Publish

on:
  push:
    tags: ["v*"]

# One release train at a time; never cancel a publish mid-flight.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: gates & npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to verify the tag sits on main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Release gates: the tagged commit must be on main and the tree clean.
      - name: verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::tag does not point at a commit on main"; exit 1; }
      # The tag names the uikit version; both packages must agree with their
      # CHANGELOGs — otherwise any v* tag would publish whatever package.json
      # happens to contain.
      - name: verify tag matches package versions and CHANGELOGs
        run: |
          TAG="${GITHUB_REF_NAME}"
          UIKIT="$(node -p "require('./packages/uikit/package.json').version")"
          TELEGRAM="$(node -p "require('./packages/telegram/package.json').version")"
          [ "$TAG" = "v$UIKIT" ] || {
            echo "::error::tag $TAG does not match tg-mini-app-uikit version $UIKIT"; exit 1; }
          # -xF: dots in the version are literals, not regex wildcards, and the
          # whole line must match — '## 0.3.1' cannot be satisfied by '## 0x3x1'.
          grep -qxF "## ${UIKIT}" packages/uikit/CHANGELOG.md || {
            echo "::error::packages/uikit/CHANGELOG.md has no '## ${UIKIT}' entry"; exit 1; }
          grep -qxF "## ${TELEGRAM}" packages/telegram/CHANGELOG.md || {
            echo "::error::packages/telegram/CHANGELOG.md has no '## ${TELEGRAM}' entry"; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: verify clean tree after build
        run: |
          test -z "$(git status --porcelain)" || {
            echo "::error::build left the tree dirty"; git status --porcelain; exit 1; }
      - run: npm run typecheck
      - run: npm run check:cycles
      - run: npm run test:unit
      - run: npm run check:package
      - run: npm run check:api
      # Topological publish: uikit resolves its @tg-mini-app/telegram peer from
      # dist. Each publish is guarded so a re-run after a partial failure (or a
      # release where one package's version is already on npm) skips instead of
      # failing with E403. The guard distinguishes "version absent" (E404 →
      # publish) from registry/auth/network errors (fail BEFORE publish): a
      # swallowed transient error must not turn into a blind publish attempt.
      - name: publish @tg-mini-app/telegram
        run: scripts/publish-if-absent.sh "@tg-mini-app/telegram"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish tg-mini-app-uikit
        run: scripts/publish-if-absent.sh "tg-mini-app-uikit"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
